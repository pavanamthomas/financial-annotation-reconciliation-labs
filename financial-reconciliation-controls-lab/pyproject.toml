[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frclab"
version = "0.1.0"
description = "Reconciliation control tests on constructed ledgers. A zero unexplained difference is not a clean recon."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Dr. Pavanam Thomas", email = "thomaspavanam@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://cursor.com/codebase/pavanam-thomas/fin-check"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
