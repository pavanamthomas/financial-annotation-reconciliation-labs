name: ci

on:
  push:
  pull_request:

jobs:
  spreadsheet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: financial-spreadsheet-annotation-audit-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python scripts/run_all.py

  document:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: financial-document-annotation-validation-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python scripts/run_all.py

  reconciliation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: financial-reconciliation-controls-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python scripts/run_all.py
